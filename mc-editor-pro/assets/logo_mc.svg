<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00aaff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b400ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo exterior -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#grad)" stroke-width="2"/>
  
  <!-- Ondas de sonido -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#00ffcc" stroke-width="1.5" opacity="0.6"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="#00aaff" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Centro -->
  <circle cx="50" cy="50" r="8" fill="url(#grad)"/>
  
  <!-- Decoración -->
  <text x="50" y="55" text-anchor="middle" font-size="20" fill="url(#grad)" font-weight="bold" font-family="Arial">♪</text>
</svg>
